<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Persona</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#" th:href="@{/}">Reservación</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#" th:href="@{/}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" th:href="@{/personas}">Clientes</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h2 class="h5 mb-0">Editar Reservacion</h2>
                    </div>
                    <div class="card-body">
                        <!-- Formulario de edición usando el ID en la URL -->
                        <form action="#" th:action="@{/actualizar/{id}(id=${persona.id})}" th:object="${persona}" method="post">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre:</label>
                                <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required />
                            </div>
                            <div class="mb-3">
                                <label for="apellido" class="form-label">Apellido:</label>
                                <input type="text" class="form-control" id="apellido" th:field="*{apellido}" required />
                            </div>
                            <div class="mb-3">
                                <label for="edad" class="form-label">Telefono:</label>
                                <input type="number" class="form-control" id="edad" th:field="*{telefono}" required />
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Correo:</label>
                                <input type="email" class="form-control" th:field="*{correo}" id="correo" required>
                            </div>
                                <div class="mb-3">
                                    <label for="noMesa" class="form-label">No. Mesa:</label>
                                    <label class="form-label">No.Mesa:</label>
                            <select class="form-select" th:field="*{noMesa}" required>
                            <option value="" selected>Selecciona la mesa</option>
                            <option value="1">Mesa 1</option>
                            <option value="2">Mesa 2</option>
                            <option value="3">Mesa 3</option>
                            <option value="4">Mesa 4</option>
                            <option value="5">Mesa 5</option>
                            <option value="6">Mesa 6</option>
                            <option value="7">Mesa 7</option>
                            <option value="8">Mesa 8</option>
                            <option value="9">Mesa 9</option>
                            <option value="10">Mesa 10</option>
                            </select>

                                </div>
                                <div class="mb-3">
                                <label class="form-label">Hora:</label>
                            <select class="form-select" th:field="*{hora}" required>
                                <option value="" selected>Selecciona una hora</option>
                                <option value="12:00">12:00</option>
                                <option value="13:00">13:00</option>
                                <option value="14:00">14:00</option>        
                                <option value="15:00">15:00</option>
                                <option value="16:00">16:00</option>
                                <option value="17:00">17:00</option>
                                <option value="18:00">18:00</option>
                                <option value="19:00">19:00</option>
                                <option value="20:00">20:00</option>
                                <option value="21:00">21:00</option>
                                <option value="22:00">22:00</option>
                            </select>
                                </div>
                                <div class="mb-3">
                                    <label for="numeroPersonas" class="form-label">No. Personas:</label>
                                    <input type="number" class="form-control" id="numeroPersonas" th:field="*{numeroPersonas}" required />
                                </div>
                                 <div class="col-md-4 mb-3">
                            <label class="form-label">Fecha:</label>
                        <input type="date" class="form-control" th:field="*{fecha}"  id="fecha" required>
                        </div>

                            <div class="d-flex justify-content-between">
                                <a href="#" th:href="@{/personas}" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary">Actualizar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p>&copy; 2026 Gestión de Personas. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    const btn = document.getElementById("toggleTheme");

    function updateIcon(theme) {
        btn.textContent = theme === "dark" ? "🌙" : "☀️";
    }

    // Cargar tema guardado
    const savedTheme = localStorage.getItem("theme") || "dark";
    document.documentElement.setAttribute("data-bs-theme", savedTheme);
    updateIcon(savedTheme);

    btn.addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-bs-theme");
        const newTheme = current === "dark" ? "light" : "dark";

        document.documentElement.setAttribute("data-bs-theme", newTheme);
        localStorage.setItem("theme", newTheme);
        updateIcon(newTheme);
    });
</script>
</body>
</html>
