<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Confirmación de Entrega – Bona Pizza</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #fff8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px 36px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
        }
        .icono { font-size: 72px; margin-bottom: 16px; }
        h1 { color: #e74c3c; font-size: 26px; margin-bottom: 8px; }
        .badge-ok {
            background: #2ecc71; color: white;
            display: inline-block; padding: 8px 22px;
            border-radius: 30px; font-size: 14px;
            font-weight: bold; margin: 12px 0 20px;
        }
        .badge-error {
            background: #e74c3c; color: white;
            display: inline-block; padding: 8px 22px;
            border-radius: 30px; font-size: 14px;
            font-weight: bold; margin: 12px 0 20px;
        }
        .mensaje { font-size: 18px; color: #333; margin-bottom: 24px; }
        .detalle {
            width: 100%; border-collapse: collapse;
            margin: 0 0 28px; text-align: left; font-size: 14px;
        }
        .detalle th {
            background: #f5f5f5; color: #888;
            font-weight: bold; padding: 8px 12px;
            border-bottom: 1px solid #eee; width: 40%;
        }
        .detalle td {
            padding: 8px 12px;
            border-bottom: 1px solid #eee;
            color: #333;
        }
        .fila-total th {
            background: #fff0f0;
            color: #e74c3c;
            font-size: 15px;
        }
        .fila-total td {
            background: #fff0f0;
            color: #e74c3c;
            font-weight: bold;
            font-size: 15px;
        }
        .btn-volver {
            display: inline-block; background: #e74c3c;
            color: white; padding: 12px 28px;
            border-radius: 8px; text-decoration: none;
            font-size: 15px; font-weight: bold;
        }
        .btn-volver:hover { background: #c0392b; }
        .footer { margin-top: 24px; color: #ccc; font-size: 11px; }
    </style>
</head>
<body>
<div class="card">

    <div class="icono" th:text="${exito} ? '✅' : '❌'"></div>

    <h1>Bona Pizza</h1>

    <span th:if="${exito}"     class="badge-ok">Entrega Confirmada</span>
    <span th:unless="${exito}" class="badge-error">Error al confirmar</span>

    <p class="mensaje" th:text="${mensaje}"></p>

    <table class="detalle" th:if="${exito and pedido != null}">
        <tr>
            <th>Nº de pedido</th>
            <td th:text="${pedido.id}"></td>
        </tr>
        <tr>
            <th>Cliente</th>
            <td th:text="${pedido.nombre + ' ' + pedido.apellido}"></td>
        </tr>
        <tr>
            <th>Sabor</th>
            <td th:text="${pedido.sabor}"></td>
        </tr>
        <tr>
            <th>Cantidad</th>
            <td th:text="${pedido.cantidad + ' pizza(s)'}"></td>
        </tr>
        <tr>
            <th>Hora</th>
            <td th:text="${pedido.hora}"></td>
        </tr>
        <tr>
            <th>Dirección</th>
            <td th:text="${pedido.direccion}"></td>
        </tr>
        <tr class="fila-total">
            <th>Total a pagar</th>
            <td th:text="'$' + ${total} + ' MXN'"></td>
        </tr>
    </table>

    <a href="/pedidos" class="btn-volver">← Volver a pedidos</a>

    <div class="footer">Bona Pizza &copy; 2025</div>
</div>
</body>
</html>
