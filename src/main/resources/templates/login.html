<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Bona Pizza</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #000;
            color: #fff;
            font-family: Georgia, serif;
        }

        .login-card {
            max-width: 450px;
            margin: 80px auto;
            background: #1a1a1a;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .title {
            text-align: center;
            margin-bottom: 20px;
        }

        .title h1 {
            color: #ff4d4d;
        }

        .btn-custom {
            background: #ff4d4d;
            color: white;
            width: 100%;
        }

        .btn-custom:hover {
            background: #cc0000;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="title">
        <h1>Bona Pizza</h1>
        <p>Acceso a reservación</p>
    </div>

    <!-- FORMULARIO -->
    <form id="loginForm">

        <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" id="correo" class="form-control" placeholder="ejemplo@gmail.com" required>
        </div>

        <button type="submit" class="btn btn-custom mt-3">
            Enviar acceso
        </button>

    </form>

    <p class="text-center mt-3 text-secondary" style="font-size:12px;">
        Recibirás un enlace para continuar tu reservación
    </p>

</div>

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
emailjs.init("MlFOkhGvQ7qvPvkda");

document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    emailjs.send("service_icnsxwp", "template_0g3q1pc", {
        correo: document.getElementById("correo").value,
        link: "http://localhost:8080/personas"
    }).then(() => {

        alert("📩 Revisa tu correo para continuar");

        // redirección a reservación
        window.location.href = "/personas";

    }).catch(err => {
        console.log(err);
    });

});
</script>

</body>
</html>
