<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservación</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Bona Pizza</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/personas}">Reservación</a>
                </li>
            </ul>

            <!-- 🌙 MODO NOCHE (NO TOCADO) -->
            <button id="toggleTheme" class="btn btn-outline-light ms-auto">🌙</button>
        </div>
    </div>
</nav>

<!-- CONTENIDO -->
<div class="container mt-4">

    <h1 class="mb-4">Reservación</h1>

    <!-- 🔴 MENSAJE DE ERROR (NUEVO) -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <strong>Error:</strong>
        <span th:text="${error}"></span>

        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- FORMULARIO -->
    <div class="card mb-4">
        <div class="card-header">
            <h2 class="h5 mb-0">Agregar Nuevo Cliente</h2>
        </div>

        <div class="card-body">

            <form th:action="@{/guardar}" id="reservaForm" th:object="${persona}" method="post">

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Nombre:</label>
                        <input type="text" class="form-control" th:field="*{nombre}" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Apellido:</label>
                        <input type="text" class="form-control" th:field="*{apellido}" required>
                    </div>

                    <div class="col-md-2 mb-3">
                        <label class="form-label">Telefono:</label>
                        <input type="text" class="form-control" th:field="*{telefono}" required>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Correo:</label>
                        <input type="email" id="correo" class="form-control" th:field="*{correo}" required>
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">No.Mesa:</label>
                        <select class="form-select" th:field="*{noMesa}" id="noMesa" required>
                            <option value="">Selecciona la mesa</option>
                            <option value="1">Mesa 1</option>
                            <option value="2">Mesa 2</option>
                            <option value="3">Mesa 3</option>
                            <option value="4">Mesa 4</option>
                            <option value="5">Mesa 5</option>
                            <option value="6">Mesa 6</option>
                            <option value="7">Mesa 7</option>
                            <option value="8">Mesa 8</option>
                            <option value="9">Mesa 9</option>
                            <option value="10">Mesa 10</option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Hora:</label>
                        <select class="form-select" th:field="*{hora}" id="hora" required>
                            <option value="">Selecciona una hora</option>
                            <option value="12:00">12:00</option>
                            <option value="13:00">13:00</option>
                            <option value="14:00">14:00</option>
                            <option value="15:00">15:00</option>
                            <option value="16:00">16:00</option>
                            <option value="17:00">17:00</option>
                            <option value="18:00">18:00</option>
                            <option value="19:00">19:00</option>
                            <option value="20:00">20:00</option>
                            <option value="21:00">21:00</option>
                            <option value="22:00">22:00</option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">No. Personas:</label>
                        <input type="number" max="10" min="1" class="form-control"
                               th:field="*{numeroPersonas}" id="numeroPersonas" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Fecha:</label>
                        <input type="date" class="form-control" th:field="*{fecha}" id="fecha" required>
                    </div>

                    <div class="col-md-2 d-flex align-items-end mb-3">
                        <button type="submit" class="btn btn-success w-100">Guardar</button>
                    </div>

                </div>
            </form>
        </div>
    </div>

    <!-- LISTA -->
    <div class="card">
        <div class="card-header">
            <h2 class="h5 mb-0">Clientes Registrados</h2>
        </div>

        <div class="card-body">

            <div th:if="${personas == null or personas.isEmpty()}" class="alert alert-info">
                No hay clientes registradas.
            </div>

            <table th:unless="${personas == null or personas.isEmpty()}"
                   class="table table-striped table-hover table-bordered">

                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Telefono</th>
                    <th>Correo</th>
                    <th>No. Mesa</th>
                    <th>Hora</th>
                    <th>Fecha</th>
                    <th>Acciones</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="persona : ${personas}">
                    <td th:text="${persona.id}"></td>
                    <td th:text="${persona.nombre}"></td>
                    <td th:text="${persona.apellido}"></td>
                    <td th:text="${persona.telefono}"></td>
                    <td th:text="${persona.correo}"></td>
                    <td th:text="${persona.noMesa}"></td>
                    <td th:text="${persona.hora}"></td>
                    <td th:text="${persona.fecha}"></td>

                    <td>
                        <a th:href="@{/editar/{id}(id=${persona.id})}" class="btn btn-primary btn-sm">
                            Editar
                        </a>

                        <a th:href="@{/eliminar/{id}(id=${persona.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Estás seguro de cancelar?');">
                            Cancelar
                        </a>
                    </td>
                </tr>
                </tbody>

            </table>
        </div>
    </div>
</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-3 mt-5">
    <p>&copy; 2026 Gestión de Clientes</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- 🌙 MODO NOCHE (NO TOCADO) -->
<script>
const btn = document.getElementById("toggleTheme");

function updateIcon(theme) {
    btn.textContent = theme === "dark" ? "🌙" : "☀️";
}

const savedTheme = localStorage.getItem("theme") || "dark";
document.documentElement.setAttribute("data-bs-theme", savedTheme);
updateIcon(savedTheme);

btn.addEventListener("click", () => {
    const current = document.documentElement.getAttribute("data-bs-theme");
    const newTheme = current === "dark" ? "light" : "dark";

    document.documentElement.setAttribute("data-bs-theme", newTheme);
    localStorage.setItem("theme", newTheme);
    updateIcon(newTheme);
});
</script>

<!-- 📧 EMAILJS (NO TOCADO) -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
emailjs.init("MlFOkhGvQ7qvPvkda");

document.getElementById("reservaForm").addEventListener("submit", function (event) {

    event.preventDefault();

    emailjs.send("service_blpguw4", "template_lqpmvqk", {
        nombre: document.getElementById("nombre").value,
        apellido: document.getElementById("apellido").value,
        correo: document.getElementById("correo").value,
        telefono: document.getElementById("telefono").value,
        mesa: document.getElementById("noMesa").value,
        hora: document.getElementById("hora").value,
        personas: document.getElementById("numeroPersonas").value,
        fecha: document.getElementById("fecha").value
    })
    .then(function () {
        alert("Reservación enviada al correo");
        document.getElementById("reservaForm").submit();
    })
    .catch(function () {
        alert("No se pudo enviar el correo");
    });

});
</script>

</body>
</html>
